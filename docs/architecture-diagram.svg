<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 标题 -->
  <text x="400" y="25" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    DIY Dictionary 系统架构
  </text>

  <!-- 用户浏览器层 -->
  <rect x="50" y="50" width="700" height="80" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="8"/>
  <text x="400" y="75" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976D2">
    用户浏览器
  </text>
  <text x="400" y="100" font-size="14" text-anchor="middle" fill="#424242">
    Vue 3 + TypeScript SPA
  </text>

  <!-- HTTP/REST 箭头 -->
  <path d="M 400 130 L 400 160" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="420" y="150" font-size="12" fill="#666">HTTP/REST</text>

  <!-- FastAPI 应用层 -->
  <rect x="50" y="160" width="700" height="280" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="8"/>

  <!-- FastAPI 标题 -->
  <text x="75" y="185" font-size="14" font-weight="bold" fill="#7B1FA2">FastAPI 应用层</text>

  <!-- 路由层 -->
  <rect x="75" y="210" width="650" height="60" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1" rx="4"/>
  <text x="90" y="230" font-size="12" font-weight="bold" fill="#7B1FA2">路由层 (API Endpoints)</text>
  <text x="90" y="250" font-size="11" fill="#424242">
    POST /api/v1/translate  •  POST /api/v1/explain-grammar  •  POST /api/v1/explain-vocabulary
  </text>

  <!-- 路由 -> 服务 箭头 -->
  <path d="M 400 270 L 400 295" stroke="#666" stroke-width="1" fill="none"/>

  <!-- 服务层 -->
  <rect x="75" y="295" width="650" height="90" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1" rx="4"/>
  <text x="90" y="315" font-size="12" font-weight="bold" fill="#7B1FA2">服务层 (Business Logic)</text>

  <!-- LLM Service -->
  <rect x="85" y="325" width="140" height="55" fill="#FCE4EC" stroke="#C2185B" stroke-width="1" rx="4"/>
  <text x="155" y="343" font-size="11" font-weight="bold" text-anchor="middle" fill="#C2185B">LLM Service</text>
  <text x="155" y="360" font-size="9" text-anchor="middle" fill="#424242">OpenAI / Claude / Gemini</text>

  <!-- Feature Services -->
  <rect x="265" y="325" width="140" height="55" fill="#FCE4EC" stroke="#C2185B" stroke-width="1" rx="4"/>
  <text x="335" y="343" font-size="11" font-weight="bold" text-anchor="middle" fill="#C2185B">Feature Services</text>
  <text x="335" y="358" font-size="9" text-anchor="middle" fill="#424242">Translation / Grammar /</text>
  <text x="335" y="370" font-size="9" text-anchor="middle" fill="#424242">Vocabulary</text>

  <!-- 其他服务 -->
  <rect x="445" y="325" width="140" height="55" fill="#FCE4EC" stroke="#C2185B" stroke-width="1" rx="4"/>
  <text x="515" y="343" font-size="11" font-weight="bold" text-anchor="middle" fill="#C2185B">Database Layer</text>
  <text x="515" y="360" font-size="9" text-anchor="middle" fill="#424242">SQLAlchemy ORM</text>

  <!-- 配置服务 -->
  <rect x="625" y="325" width="90" height="55" fill="#FCE4EC" stroke="#C2185B" stroke-width="1" rx="4"/>
  <text x="670" y="343" font-size="11" font-weight="bold" text-anchor="middle" fill="#C2185B">Config</text>
  <text x="670" y="360" font-size="9" text-anchor="middle" fill="#424242">Environment</text>

  <!-- 服务 -> 数据库 箭头 -->
  <path d="M 400 385 L 400 410" stroke="#666" stroke-width="1" fill="none"/>

  <!-- 数据层 -->
  <rect x="75" y="410" width="650" height="20" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1" rx="4"/>
  <text x="90" y="424" font-size="11" font-weight="bold" fill="#7B1FA2">数据持久化层 (SQLAlchemy ORM)</text>

  <!-- 数据库 -> 存储 箭头 -->
  <path d="M 400 430 L 400 455" stroke="#666" stroke-width="1" fill="none"/>

  <!-- 存储层 -->
  <g>
    <!-- SQLite -->
    <rect x="75" y="455" width="140" height="100" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="6"/>
    <circle cx="145" cy="490" r="20" fill="#4CAF50"/>
    <text x="145" y="496" font-size="10" text-anchor="middle" fill="white" font-weight="bold">DB</text>
    <text x="145" y="535" font-size="12" text-anchor="middle" fill="#388E3C" font-weight="bold">SQLite</text>
    <text x="145" y="550" font-size="10" text-anchor="middle" fill="#424242">(本地开发)</text>

    <!-- OpenAI API -->
    <rect x="245" y="455" width="140" height="100" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="6"/>
    <circle cx="315" cy="490" r="20" fill="#FF9800"/>
    <text x="315" y="496" font-size="10" text-anchor="middle" fill="white" font-weight="bold">API</text>
    <text x="315" y="535" font-size="12" text-anchor="middle" fill="#F57C00" font-weight="bold">OpenAI</text>
    <text x="315" y="550" font-size="10" text-anchor="middle" fill="#424242">GPT-4</text>

    <!-- Claude API -->
    <rect x="415" y="455" width="140" height="100" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="6"/>
    <circle cx="485" cy="490" r="20" fill="#9C27B0"/>
    <text x="485" y="496" font-size="10" text-anchor="middle" fill="white" font-weight="bold">API</text>
    <text x="485" y="535" font-size="12" text-anchor="middle" fill="#7B1FA2" font-weight="bold">Claude</text>
    <text x="485" y="550" font-size="10" text-anchor="middle" fill="#424242">Sonnet</text>

    <!-- Gemini API -->
    <rect x="585" y="455" width="140" height="100" fill="#E0F2F1" stroke="#00897B" stroke-width="2" rx="6"/>
    <circle cx="655" cy="490" r="20" fill="#009688"/>
    <text x="655" y="496" font-size="10" text-anchor="middle" fill="white" font-weight="bold">API</text>
    <text x="655" y="535" font-size="12" text-anchor="middle" fill="#00897B" font-weight="bold">Gemini</text>
    <text x="655" y="550" font-size="10" text-anchor="middle" fill="#424242">Pro</text>
  </g>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
