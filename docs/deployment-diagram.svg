<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 标题 -->
  <text x="400" y="25" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">
    部署架构 - 本地开发 vs 生产环境
  </text>

  <!-- ==================== 本地开发 ==================== -->
  <rect x="30" y="50" width="340" height="430" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="8"/>
  <text x="200" y="75" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976D2">
    本地开发环境
  </text>

  <!-- 前端 (本地) -->
  <rect x="50" y="100" width="300" height="70" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" rx="6"/>
  <circle cx="90" cy="135" r="15" fill="#42A5F5"/>
  <text x="90" y="141" font-size="10" text-anchor="middle" fill="white" font-weight="bold">FE</text>
  <text x="150" y="135" font-size="13" font-weight="bold" fill="#1976D2">npm run dev</text>
  <text x="150" y="155" font-size="11" fill="#424242">http://localhost:3000</text>

  <!-- 后端 (本地) -->
  <rect x="50" y="190" width="300" height="70" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" rx="6"/>
  <circle cx="90" cy="225" r="15" fill="#42A5F5"/>
  <text x="90" y="231" font-size="10" text-anchor="middle" fill="white" font-weight="bold">BE</text>
  <text x="150" y="225" font-size="13" font-weight="bold" fill="#1976D2">python -m app.main</text>
  <text x="150" y="245" font-size="11" fill="#424242">http://localhost:8000</text>

  <!-- SQLite (本地) -->
  <rect x="50" y="280" width="300" height="70" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" rx="6"/>
  <circle cx="90" cy="315" r="15" fill="#42A5F5"/>
  <text x="90" y="321" font-size="10" text-anchor="middle" fill="white" font-weight="bold">DB</text>
  <text x="150" y="315" font-size="13" font-weight="bold" fill="#1976D2">SQLite</text>
  <text x="150" y="335" font-size="11" fill="#424242">diy_dictionary.db (自动创建)</text>

  <!-- 配置 (本地) -->
  <rect x="50" y="370" width="300" height="70" fill="#FFFFFF" stroke="#1976D2" stroke-width="2" rx="6"/>
  <circle cx="90" cy="405" r="15" fill="#42A5F5"/>
  <text x="90" y="411" font-size="10" text-anchor="middle" fill="white" font-weight="bold">⚙</text>
  <text x="150" y="405" font-size="13" font-weight="bold" fill="#1976D2">.env 配置</text>
  <text x="150" y="425" font-size="11" fill="#424242">LLM_PROVIDER=claude</text>

  <!-- 连接箭头 (本地) -->
  <path d="M 200 170 L 200 190" stroke="#1976D2" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 200 260 L 200 280" stroke="#1976D2" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- ==================== 生产环境 ==================== -->
  <rect x="430" y="50" width="340" height="430" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="8"/>
  <text x="600" y="75" font-size="16" font-weight="bold" text-anchor="middle" fill="#7B1FA2">
    生产环境
  </text>

  <!-- Nginx -->
  <rect x="450" y="100" width="300" height="60" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="2" rx="6"/>
  <circle cx="490" cy="130" r="12" fill="#9C27B0"/>
  <text x="490" y="135" font-size="9" text-anchor="middle" fill="white" font-weight="bold">LB</text>
  <text x="550" y="135" font-size="13" font-weight="bold" fill="#7B1FA2">Nginx (反向代理)</text>

  <!-- Docker Containers -->
  <text x="600" y="185" font-size="12" font-weight="bold" fill="#7B1FA2">Docker Containers</text>

  <!-- 前端 (生产) -->
  <rect x="450" y="200" width="300" height="60" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1" rx="6"/>
  <circle cx="490" cy="230" r="12" fill="#9C27B0"/>
  <text x="490" y="235" font-size="9" text-anchor="middle" fill="white" font-weight="bold">🐳</text>
  <text x="550" y="230" font-size="12" font-weight="bold" fill="#7B1FA2">Frontend</text>
  <text x="550" y="250" font-size="10" fill="#424242">Gunicorn + Nginx</text>

  <!-- 后端 (生产) -->
  <rect x="450" y="280" width="300" height="60" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1" rx="6"/>
  <circle cx="490" cy="310" r="12" fill="#9C27B0"/>
  <text x="490" y="315" font-size="9" text-anchor="middle" fill="white" font-weight="bold">🐳</text>
  <text x="550" y="310" font-size="12" font-weight="bold" fill="#7B1FA2">Backend</text>
  <text x="550" y="330" font-size="10" fill="#424242">Uvicorn + Gunicorn</text>

  <!-- PostgreSQL (生产) -->
  <rect x="450" y="360" width="300" height="60" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1" rx="6"/>
  <circle cx="490" cy="390" r="12" fill="#9C27B0"/>
  <text x="490" y="395" font-size="9" text-anchor="middle" fill="white" font-weight="bold">DB</text>
  <text x="550" y="390" font-size="12" font-weight="bold" fill="#7B1FA2">PostgreSQL</text>
  <text x="550" y="410" font-size="10" fill="#424242">持久化数据存储</text>

  <!-- 连接箭头 (生产) -->
  <path d="M 600 160 L 600 200" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 600 260 L 600 280" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 600 340 L 600 360" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- 说明文本 -->
  <text x="400" y="465" font-size="12" text-anchor="middle" fill="#666">
    ✓ 本地开发：一键启动，无需数据库配置  |  ✓ 生产环境：Docker 容器化，专业部署
  </text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976D2"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7B1FA2"/>
    </marker>
  </defs>
</svg>
